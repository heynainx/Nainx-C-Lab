<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nainx C Lab – 850+ C programs and patterns you can compile</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef6fb;--pn:#ffffff;--pn2:#e3eef7;--ln:#cfe0ee;--tx:#0f2233;--mu:#58728a;--ac:#2f6fd6;--ac2:#e59a00;--ok:#0f8a5f}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#070b17;--pn:#0e1528;--pn2:#16203a;--ln:#243252;--tx:#e8f1ff;--mu:#8ea4c4;--ac:#5fb0ff;--ac2:#ffd43b;--ok:#4be0a8}}
:root[data-theme=dark]{--bg:#070b17;--pn:#0e1528;--pn2:#16203a;--ln:#243252;--tx:#e8f1ff;--mu:#8ea4c4;--ac:#5fb0ff;--ac2:#ffd43b;--ok:#4be0a8}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Plus Jakarta Sans,system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--ln);background:var(--pn);position:relative;flex-wrap:wrap}
.brand{font:800 22px 'Sora',sans-serif;letter-spacing:-.03em;display:flex;align-items:center;gap:10px}
.brand i{width:32px;height:32px;border-radius:9px;background:var(--ac);display:grid;place-items:center;color:#fff;font:500 14px 'JetBrains Mono',monospace;font-style:normal;transform:rotate(-6deg);transition:transform .3s}
.brand:hover i{transform:rotate(6deg) scale(1.08)}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mu)}
.bar{width:140px;height:8px;border-radius:9px;background:var(--pn2);overflow:hidden}
.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.ib{border:1px solid var(--ln);background:var(--pn2);border-radius:10px;padding:6px 10px}
.wrap{flex:1;display:grid;grid-template-columns:360px 1fr;min-height:0}
aside{border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0;background:var(--pn)}
.sh{padding:12px;display:grid;gap:10px;border-bottom:1px solid var(--ln)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--pn2);border-radius:12px;padding:4px;position:relative}
.seg button{border:0;background:none;padding:8px;border-radius:9px;font-weight:600;color:var(--mu);position:relative;z-index:1;transition:color .25s}
.seg button.on{color:#fff}
.seg .pill{position:absolute;top:4px;bottom:4px;border-radius:9px;background:var(--ac);transition:left .3s cubic-bezier(.3,1.3,.5,1),width .3s}
#q{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--ln);background:none;border-radius:99px;padding:4px 11px;font-size:13px;color:var(--mu);transition:.2s}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.chip:hover{border-color:var(--ac)}
#list{flex:1;overflow:auto;padding:8px;scroll-behavior:smooth}
.it{display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:10px 12px;border:0;border-radius:12px;background:none;margin-bottom:2px;animation:in .45s both;animation-delay:var(--d);transition:background .2s,transform .2s}
@keyframes in{from{opacity:0;transform:translateX(-14px)}}
.it:hover{background:var(--pn2);transform:translateX(3px)}
.it.on{background:var(--pn2);box-shadow:inset 3px 0 0 var(--ac)}
.it span{flex:1;font-weight:500;line-height:1.25}
.it small{display:block;color:var(--mu);font-weight:400;font-size:12px;margin-top:2px}
.tag{font:500 11px 'JetBrains Mono',monospace;padding:2px 7px;border-radius:6px;background:var(--pn2);color:var(--mu)}
.tag.c{color:#2f7de1}.tag.cpp{color:var(--ac2)}
.tick{color:var(--ok);font-weight:700;opacity:0;transform:scale(.4);transition:.3s}
.it.done .tick{opacity:1;transform:none}
.empty{padding:30px 14px;text-align:center;color:var(--mu)}
main{position:relative;overflow:auto;min-height:0;scroll-behavior:smooth}
#sp{position:sticky;top:0;height:3px;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));z-index:5}
.dt{max-width:860px;margin:0 auto;padding:22px 22px 60px;animation:sw .45s cubic-bezier(.2,.8,.2,1)}
@keyframes sw{from{opacity:0;transform:translateY(16px)}}
.back{display:none}
h1{font:800 clamp(26px,4vw,38px)/1.08 'Sora',sans-serif;letter-spacing:-.035em;margin:6px 0 8px}
.desc{color:var(--mu);margin-bottom:16px;max-width:60ch;line-height:1.55}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.btn{position:relative;overflow:hidden;border:1px solid var(--ln);background:var(--pn);border-radius:11px;padding:9px 14px;font-weight:600;transition:transform .15s,border-color .2s,background .2s}
.btn:hover{border-color:var(--ac);transform:translateY(-2px)}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn .rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);width:10px;height:10px;transform:translate(-50%,-50%) scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:translate(-50%,-50%) scale(24);opacity:0}}
.sl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mu)}
.sl input{accent-color:var(--ac)}
pre.code{background:#13111f;color:#e8e6f5;border-radius:16px;padding:16px 0;overflow:auto;font:400 14px/1.65 'JetBrains Mono',monospace;counter-reset:l;border:1px solid var(--ln);margin-bottom:14px}
.l{display:block;padding:0 18px 0 8px;white-space:pre;animation:ln .35s both;animation-delay:var(--d)}
@keyframes ln{from{opacity:0;transform:translateX(-8px)}}
.l::before{counter-increment:l;content:counter(l);display:inline-block;width:32px;margin-right:14px;text-align:right;color:#5b5780;user-select:none}
.l:hover{background:rgba(154,130,255,.1)}
.k{color:#ff8fc4}.s{color:#8fe8b0}.n{color:#ffcf70}.c{color:#7c78a3;font-style:italic}.f{color:#78dcff}
.term{background:#0a0912;color:#d9f7e4;border-radius:16px;font:400 14px/1.55 'JetBrains Mono',monospace;padding:14px 16px;min-height:90px;overflow:auto;border:1px solid var(--ln);white-space:pre}
.term .cmd{color:#8b87b3}
.term .st{display:block;margin-top:8px;color:#4be0a8}
.cur{display:inline-block;width:8px;height:15px;background:#4be0a8;vertical-align:-2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.nv{display:flex;justify-content:space-between;margin-top:18px}
.top{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:42px;height:42px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:18px;opacity:0;transform:translateY(20px);transition:.3s;pointer-events:none}
.top.on{opacity:1;transform:none;pointer-events:auto}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;font-weight:600;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
.hero{padding:60px 24px;text-align:center;color:var(--mu)}
.hero h2{font:800 30px 'Sora',sans-serif;color:var(--tx);letter-spacing:-.03em;margin-bottom:8px}
@media(max-width:820px){
 html,body{height:100%}
 .wrap{display:block;position:relative}
 aside{height:100%;border:0}
 main{position:absolute;inset:0;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);background:var(--bg);z-index:6}
 body.sel main{transform:none}
 .back{display:inline-flex}
 .prog{margin-left:0;width:100%}.bar{flex:1}
 .hero{display:none}
}
@media(prefers-reduced-motion:reduce){*,*::before{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(640px 420px at 88% -8%,color-mix(in srgb,var(--ac) 28%,transparent),transparent),radial-gradient(520px 420px at -6% 104%,color-mix(in srgb,var(--ac2) 20%,transparent),transparent)}
header,aside{background:color-mix(in srgb,var(--pn) 78%,transparent);backdrop-filter:blur(16px)}
.brand i{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#06101f;font-weight:700}
.btn.pri{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,var(--ac2)));border:0;color:#06101f}
.it{border-radius:14px}.it.on{box-shadow:0 0 0 1px var(--ac),0 10px 30px -14px var(--ac)}
.btn,.seg,#q,.chip{backdrop-filter:blur(6px)}
</style>

<script>
const SH=[
['Right triangle',{R:'n',sp:'0',c:'i',e:'i==n'}],
['Inverted right triangle',{R:'n',sp:'0',c:'n-i+1'}],
['Mirrored right triangle',{R:'n',sp:'n-i',c:'i'}],
['Inverted mirrored triangle',{R:'n',sp:'i-1',c:'n-i+1'}],
['Pyramid',{R:'n',sp:'n-i',c:'2*i-1',e:'i==n'}],
['Inverted pyramid',{R:'n',sp:'i-1',c:'2*(n-i)+1',e:'i==1'}],
['Square',{R:'n',sp:'0',c:'n',e:'i==1||i==n'}],
['Rectangle',{R:'n',sp:'0',c:'2*n',e:'i==1||i==n'}],
['Diamond',{R:'2*n-1',k:'i<=n?i:2*n-i',sp:'n-k',c:'2*k-1',e:'0'}],
['Half diamond',{R:'2*n-1',k:'i<=n?i:2*n-i',sp:'0',c:'k'}],
['Hourglass',{R:'2*n-1',k:'i<=n?n-i+1:i-n+1',sp:'n-k',c:'2*k-1',e:'i==1||i==2*n-1'}]];
const FL=[
['stars','l','*',0],['hash','l','#',0],['numbers by column','n','j',1],['numbers by row','n','i',1],
['reverse numbers','n','cnt-j+1',1],['alphabets by column','c',"'A'+j-1",1],['alphabets by row','c',"'A'+i-1",1],
['binary 0-1','n','(i+j)%2',1],['odd numbers','n','2*j-1',1]];
const ev=(s,n,i,j,k,cnt)=>new Function('n','i','j','k','cnt','return ('+s+')')(n,i,j,k,cnt);
function patOut(sh,fi,n,hol){
  const S=SH[sh][1],F=FL[fi];let out='';const R=ev(S.R,n,0,0,0,0);
  for(let i=1;i<=R;i++){
    const k=S.k?ev(S.k,n,i,0,0,0):i,sp=ev(S.sp,n,i,0,k,0),cnt=ev(S.c,n,i,0,k,0);
    let row=' '.repeat(sp*(F[3]&&!hol?2:1));
    for(let j=1;j<=cnt;j++){
      if(hol)row+=(j==1||j==cnt||ev(S.e,n,i,j,k,cnt))?'*':' ';
      else if(F[1]=='l')row+=F[2];
      else{const v=ev(F[2].replace(/'A'/g,'65'),n,i,j,k,cnt);row+=(F[1]=='n'?v:String.fromCharCode(v))+' '}
    }
    out+=row+'\n';
  }
  return out;
}

function patCodeC(sh,fi,n,hol){
 const S=SH[sh][1],F=FL[fi],w=F[3]&&!hol?2:1;
 const f=s=>s.replace(/\s*([-+*%<>=?:])\s*/g,' $1 ').replace(/\s+/g,' ').trim();
 const kp=(sh==8||sh==9)?'i <= n ? i : 2 * n - i':sh==10?'i <= n ? n - i + 1 : i - n + 1':'';
 const e=(S.e||'').replace(/==/g,' == ').replace(/\|\|/g,' || ').replace(/\*/g,' * ').replace(/-/g,' - ');
 const sp=f(S.sp),ex=f(F[2]);
 let c=`// Pattern: ${SH[sh][0]} of ${hol?'hollow stars':FL[fi][0]}\n#include <stdio.h>\n\nint main() {\n  int n = ${n}; // size of the pattern (try changing it)\n  for (int i = 1; i <= ${S.R=='n'?'n':'2 * n - 1'}; i++) { // one pass per row\n`;
 if(kp)c+=`    int k = ${kp}; // distance from the widest row\n`;
 c+=`    int cnt = ${f(S.c)}; // symbols in this row\n`;
 if(S.sp!='0')c+=`    for (int s = 0; s < ${w==2?(/^\w+$/.test(sp)?sp+' * 2':'('+sp+') * 2'):sp}; s++) printf(" "); // leading spaces\n`;
 if(hol)c+=`    for (int j = 1; j <= cnt; j++)\n      printf((j == 1 || j == cnt${S.e=='0'?'':' || '+e}) ? "*" : " "); // border only\n`;
 else if(F[1]=='l')c+=`    for (int j = 1; j <= cnt; j++) printf("${F[2]}"); // repeat the symbol\n`;
 else if(F[1]=='n')c+=`    for (int j = 1; j <= cnt; j++) printf("%d ", ${ex}); // one number per column\n`;
 else c+=`    for (int j = 1; j <= cnt; j++) printf("%c ", ${F[2].includes('j')?"'A' + j - 1":"'A' + i - 1"}); // letters from A\n`;
 return c+'    printf("\\n"); // finish the row\n  }\n  return 0;\n}\n';
}

const codeOf=i=>i.g?patCodeC(i.g[0],i.g[1],pn,i.g[2]):i.code;
const outOf=i=>i.g?patOut(i.g[0],i.g[1],pn,i.g[2]):i.out;
const L=()=>ITEMS.filter(i=>i.t==tab&&(lg=='all'||i.l==lg||i.l=='both')&&(cat=='All'||i.cat==cat)&&(!q||(i.title+' '+i.cat).toLowerCase().includes(q)));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1600)}
function counts(){const p=ITEMS.filter(i=>i.t=='prog').length,t=ITEMS.length-p;
 document.querySelector('[data-t=prog]').textContent='Programs · '+p;document.querySelector('[data-t=pat]').textContent='Patterns · '+t;
 $('pt').textContent=done.size+' / '+ITEMS.length+' learned';$('pb').style.width=(done.size/ITEMS.length*100)+'%'}
function pill(){const b=document.querySelector('.seg .on'),p=document.querySelector('.pill');p.style.left=b.offsetLeft+'px';p.style.width=b.offsetWidth+'px'}
function chips(){
  const cs=['All',...new Set(ITEMS.filter(i=>i.t==tab).map(i=>i.cat))];
 $('cats').innerHTML=cs.map(c=>`<button class="chip ${cat==c?'on':''}" data-c="${c}">${c}</button>`).join('')}
function list(){const a=L();
 $('list').innerHTML=a.length?a.map((i,k)=>`<button class="it ${cur&&cur.id==i.id?'on':''} ${done.has(i.id)?'done':''}" data-id="${i.id}" style="--d:${Math.min(k,14)*28}ms"><span>${esc(i.title)}<small>${esc(i.cat)}</small></span><b class="tick">✓</b><em class="tag">${i.t=='pat'?'pattern':'c'}</em></button>`).join(''):'<div class="empty">No matches. Try another word or filter.</div>';
 $('list').scrollTop=0}
function show(id,push){const i=ITEMS.find(x=>x.id==id);if(!i)return;cur=i;
 if(i.l!='both')plang=i.l;
 if(push)try{history.replaceState(null,'','#'+id)}catch(e){}
 const g=!!i.g,c=codeOf(i),desc=g?'Change the size below and watch the code and output update.':(c.match(/\/\/ (.*)/)||['',''])[1];
 $('dt').innerHTML=`<div class="dt"><button class="btn back" id="bk">← Back</button>
 <h1>${esc(i.title)}</h1><p class="desc">${esc(desc)}</p>
 <div class="row"><span class="tag">C (gcc)</span>
 ${g?`<label class="sl">Size <input type="range" id="sz" min="3" max="9" value="${pn}"><b id="szv">${pn}</b></label>`:''}</div>
 <pre class="code" id="code"></pre>
 <div class="row"><button class="btn pri" id="run">▶ Run</button><button class="btn" id="cp">Copy code</button><button class="btn" id="cpc">Copy with comments</button><button class="btn ${done.has(i.id)?'ok':''}" id="lr">${done.has(i.id)?'✓ Learned':'Mark as learned'}</button></div>
 <div class="term" id="term"><span class="cmd">Press Run to compile and execute this program.</span></div>
 <div class="nv"><button class="btn" id="pv">← Previous</button><button class="btn" id="nx">Next →</button></div></div>`;
 drawCode();document.body.classList.add('sel');$('main').scrollTop=0;
 document.querySelectorAll('.it').forEach(b=>b.classList.toggle('on',b.dataset.id==id));
 if(i.g)run(true)}
function drawCode(){const i=cur,c=codeOf(i);$('code').innerHTML=c.trimEnd().split('\n').map((l,k)=>`<span class="l" style="--d:${Math.min(k,24)*18}ms">${hi(l)||' '}</span>`).join('')}
let rt=0;
function run(quiet){const i=cur,o=outOf(i),tm=$('term'),ln=o.split('\n');if(ln[ln.length-1]==='')ln.pop();
 const cmd='$ gcc main.c -o main && ./main';
 clearTimeout(rt);tm.innerHTML='<span class="cmd">'+cmd+'</span>\n<span id="o"></span><span class="cur"></span>';
 const out=$('o');let k=0;const d=quiet?0:Math.min(70,900/Math.max(ln.length,1));
 (function step(){if(k<ln.length){out.textContent+=ln[k++]+'\n';tm.scrollTop=tm.scrollHeight;rt=setTimeout(step,d)}
  else{tm.querySelector('.cur').outerHTML='<span class="st">✔ Finished with exit code 0</span>'}})()}
function copy(t,m){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(m),()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast(m)}catch(e){toast('Copy failed')}a.remove()})}
function nav(d){const a=L(),k=a.findIndex(x=>x.id==cur.id);const n=a[k+d];if(n){show(n.id,1);const b=document.querySelector(`.it[data-id="${n.id}"]`);if(b)b.scrollIntoView({block:'nearest'})}else toast(d>0?'That was the last one':'This is the first one')}
function learned(){const i=cur;done.has(i.id)?done.delete(i.id):done.add(i.id);store.set('lab_done',[...done].join(','));counts();
 const b=$('lr');b.classList.toggle('ok',done.has(i.id));b.textContent=done.has(i.id)?'✓ Learned':'Mark as learned';
 const it=document.querySelector(`.it[data-id="${i.id}"]`);if(it)it.classList.toggle('done',done.has(i.id));toast(done.has(i.id)?'Nice work! Saved to your progress':'Removed from learned')}
function refresh(){chips();list()}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.classList.contains('btn')){const r=t.getBoundingClientRect(),s=document.createElement('span');s.className='rp';s.style.left=(e.clientX-r.left)+'px';s.style.top=(e.clientY-r.top)+'px';t.appendChild(s);setTimeout(()=>s.remove(),600)}
 if(t.closest('#tabs')){tab=t.dataset.t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b==t));cat='All';pill();refresh()}
 else if(t.dataset.l!==undefined&&t.closest('#lg')){lg=t.dataset.l;refresh()}
 else if(t.dataset.c!==undefined){cat=t.dataset.c;refresh()}
 else if(t.classList.contains('it'))show(t.dataset.id,1);
 else if(t.dataset.pl){plang=t.dataset.pl;document.querySelectorAll('#lsw button').forEach(b=>b.classList.toggle('on',b==t));drawCode();if(cur.g)run(true);else{const o=$('term');}}
 else if(t.id=='run')run();
 else if(t.id=='cp')copy(strip(codeOf(cur)),'Copied clean code (no comments)');
 else if(t.id=='cpc')copy(codeOf(cur),'Copied with comments');
 else if(t.id=='lr')learned();
 else if(t.id=='nx')nav(1);else if(t.id=='pv')nav(-1);
 else if(t.id=='bk'){document.body.classList.remove('sel');try{history.replaceState(null,'',location.pathname)}catch(e){}}
 else if(t.id=='rnd'){const a=ITEMS.filter(i=>i.t==tab);const p=a[Math.floor(Math.random()*a.length)];cat='All';refresh();show(p.id,1);const b=document.querySelector(`.it[data-id="${p.id}"]`);if(b)b.scrollIntoView({block:'center'});toast('Surprise: '+p.title)}
 else if(t.id=='top')$('main').scrollTop=0;
 else if(t.id=='th'){const d=document.documentElement,dk=d.dataset.theme?d.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dk?'light':'dark';store.set('lab_theme',d.dataset.theme)}});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value.trim().toLowerCase();list()}
 if(e.target.id=='sz'){pn=+e.target.value;$('szv').textContent=pn;drawCode();run(true)}});
$('main').addEventListener('scroll',()=>{const m=$('main');$('sp').style.width=(m.scrollTop/Math.max(1,m.scrollHeight-m.clientHeight)*100)+'%';$('top').classList.toggle('on',m.scrollTop>400)});
const th=store.get('lab_theme','');if(th)document.documentElement.dataset.theme=th;
counts();refresh();pill();window.addEventListener('resize',pill);
function route(){const h=location.hash.slice(1);if(h&&ITEMS.some(i=>i.id==h)){const i=ITEMS.find(x=>x.id==h);if(i.t!=tab){tab=i.t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));pill();refresh()}show(h,0)}}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
